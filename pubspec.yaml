name: crash_pilot
description: >-
  Autonomous self-healing & Shorebird hot-patch bot for Flutter apps.
  Ingests Sentry/Crashlytics crash reports, parses Dart AST, synthesizes
  surgical AI fixes (Gemini, Claude, OpenAI), verifies via flutter analyze &
  flutter test, and dispatches GitHub PRs + Shorebird OTA patches automatically.
version: 1.0.0
repository: https://github.com/vaibhavbadhe712/crash_pilot
homepage: https://github.com/vaibhavbadhe712/crash_pilot
documentation: https://github.com/vaibhavbadhe712/crash_pilot/blob/main/README.md
topics:
  - crash-reporting
  - flutter
  - devops
  - automation
  - shorebird

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  analyzer: ^6.2.0
  args: ^2.7.0
  http: ^1.2.0
  meta: ^1.12.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  crashpilot: crash_pilot
